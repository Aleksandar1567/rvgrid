[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rvgrid"
version = "0.1.0"
description = "A custom RISC-V SoC written in Python (Amaranth HDL), simulated with cocotb + Verilator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "amaranth[builtin-yosys]==0.5.10",
    "cocotb==2.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rvgrid = "rvgrid.__main__:main"

[tool.setuptools.packages.find]
include = ["rvgrid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "system: full-SoC tests (needs Verilator + RISC-V GCC, see scripts/setup-tools.sh)",
]
